[package]
name = "a0-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.85"

[dependencies]
# Default: bundled plain SQLite + OS-level at-rest protection (iOS File
# Protection, Android FBE/Keystore). Enabling `sqlcipher` switches to
# bundled SQLCipher with vendored OpenSSL for explicit file encryption on
# hosts whose toolchain provides perl+make (e.g. the mobile build machines).
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = "1"
a0-core = { path = "../a0-core" }

[features]
default = []
# Explicit SQLCipher file encryption (requires perl + make at build time).
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
