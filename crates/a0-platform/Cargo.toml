[package]
name = "a0-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.85"

# staticlib (iOS) and cdylib (Android) artifacts are consumed by
# scripts/build-ios.sh / scripts/build-android.sh; rlib keeps host
# cargo test fast.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uniffi = { version = "0.31", optional = true }
a0-core = { path = "../a0-core" }
a0-api = { path = "../a0-api" }
a0-auth = { path = "../a0-auth" }
a0-realtime = { path = "../a0-realtime" }
a0-storage = { path = "../a0-storage" }
a0-chat = { path = "../a0-chat" }
a0-projects = { path = "../a0-projects" }
a0-plugins = { path = "../a0-plugins" }
a0-workspace = { path = "../a0-workspace" }
a0-ui = { path = "../a0-ui" }

# The bindgen CLI lives in this workspace (src/bin/uniffi-bindgen.rs);
# it is built only with --features bindgen (required-features below),
# so plain builds and tests stay dependency-light.
[features]
default = ["ffi"]
ffi = ["dep:uniffi"]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
