# Rust checks: fmt, clippy, tests (host), MSRV 1.85.
name: rust
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MSRV toolchain installed FIRST so the stable toolchain below becomes
      # the default; fmt/clippy/tests run on stable, MSRV pinned via +1.85.0.
      - name: Install MSRV toolchain (1.85.0)
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Install stable toolchain (default)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: MSRV check (1.85.0)
        run: cargo +1.85.0 check --workspace
