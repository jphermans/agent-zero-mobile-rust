# iOS build: Rust staticlibs + UniFFI Swift + XcodeGen + xcodebuild.
name: ios
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Install uniffi-bindgen + XcodeGen
        run: |
          cargo install uniffi-bindgen-cli --version 0.31.0 --locked
          brew install xcodegen
      - name: Build Rust core + bindings + xcframework
        run: ./scripts/build-ios.sh
      - name: Regenerate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate
      - name: xcodebuild (Simulator, unsigned)
        run: xcodebuild build -project platforms/ios/AgentZero.xcodeproj -scheme AgentZero -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
