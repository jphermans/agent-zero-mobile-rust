# Android build: Rust cdylibs + UniFFI Kotlin + Gradle assembleDebug.
name: android
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk + uniffi-bindgen
        run: |
          cargo install cargo-ndk
          cargo install uniffi-bindgen-cli --version 0.31.0 --locked
      - name: Build Rust core + bindings
        run: ./scripts/build-android.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME || env.ANDROID_NDK_ROOT }}
      - name: Gradle assembleDebug
        working-directory: platforms/android
        run: |
          gradle wrapper --gradle-version 8.10.2
          ./gradlew assembleDebug
