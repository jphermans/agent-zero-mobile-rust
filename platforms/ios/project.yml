# XcodeGen spec for the Agent Zero iOS app.
# Regenerate the checked-in project with:
#   cd platforms/ios && xcodegen generate
# (the checked-in AgentZero.xcodeproj is hand-authored; xcodegen output wins
#  if anything drifts).
name: AgentZero
options:
  bundleIdPrefix: com.jphermans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.10
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
targets:
  AgentZero:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated
        optional: true
      - path: RustBridge/Sources/A0Platform
        createIntermediateGroups: true
    dependencies:
      - package: RustBridge
    packages:
      RustBridge:
        location: RustBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jphermans.agentzeromobile
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Agent Zero uses the microphone for voice input to chat with your local agent."
        INFOPLIST_KEY_NSCameraUsageDescription: "Agent Zero uses the camera to capture photos and scan QR codes for server onboarding."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Agent Zero accesses your photo library to attach images to chat messages."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Agent Zero uses speech recognition for on-device voice chat input."
        INFOPLIST_KEY_UISupportedOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
      gatherCoverageData: false
